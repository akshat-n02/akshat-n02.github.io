<header class="site-header">
  <div class="header-top">
    <nav class="header-menu">
      {% for item in site.data.settings.menu %}
        <a href="{{ item.url }}">{{ item.name }}</a>
      {% endfor %}
    </nav>
    <h3 class="site-title">
      <a href="{{ site.github.url }}/">Akshat Nagar<br>Portfolio</a>
    </h3>
    <nav class="header-social">
      {% for item in site.data.settings.social %}
        <a href="{{ item.link }}" target="_blank"><i class="fa fa-{{ item.icon }}" aria-hidden="true"></i></a>
      {% endfor %}
      <span class="header-location">Berlin, Germany</span>
    </nav>
  </div>
  <div class="dropdown">
    <button class="dropbtn"><i class="fa fa-bars" aria-hidden="true"></i></button>
    <div class="dropdown-content">
      {% for item in site.data.settings.menu %}
        <a href="{{ item.url }}" class="menu-link">{{ item.name }}</a>
      {% endfor %}
      {% for item in site.data.settings.social %}
        <a href="{{ item.link }}" class="menu-link" target="_blank"><i class="fa fa-{{ item.icon }}" aria-hidden="true"></i></a>
      {% endfor %}
    </div>
  </div>
</header>
