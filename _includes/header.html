<style>
.site-header {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 20px 40px 0 40px;
  border-bottom: 1px solid #eee;
}
.header-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  width: 100%;
  padding-bottom: 10px;
}
.header-social a, .header-menu a {
  margin: 0 8px;
  text-decoration: none;
  color: inherit;
  font-size: 14px;
}
.site-title {
  text-align: center;
  font-size: 28px;
  margin: 10px 0 20px 0;
}
.site-title a {
  text-decoration: none;
  color: inherit;
}
.dropdown {
  display: none;
}
@media (max-width: 600px) {
  .header-top { display: none; }
  .site-title { display: none; }
  .dropdown { display: block; }
}
</style>

<header class="site-header">
  <div class="header-top">
    <nav class="header-social">
      {% for item in site.data.settings.social %}
        <a href="{{ item.link }}" target="_blank"><i class="fa fa-{{ item.icon }}" aria-hidden="true"></i></a>
      {% endfor %}
    </nav>
    <nav class="header-menu">
      {% for item in site.data.settings.menu %}
        <a href="{{ site.github.url }}/{{ item.url }}">{{ item.name }}</a>
      {% endfor %}
    </nav>
  </div>

    <a href="{{ site.github.url }}/">Akshat Nagar<br> <br>Portfolio</a>
